[project]
name = "codeshadow"
version = "1.0.0"
description = "CodeShadow FastAPI application"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi[standard]==0.115.12",
    "uvicorn[standard]==0.32.0",
    "jinja2==3.1.6",
    "python-dotenv==1.1.0",
    "itsdangerous==2.2.0",
    "sqlalchemy==2.0.43",
    "psycopg[binary]==3.2.9",
]

[tool.uvicorn]
app = "app.main:app"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
